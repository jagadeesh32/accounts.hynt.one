# accounts.hynt.one — reverse proxy.
#
# Two things here are load-bearing rather than cosmetic:
#
#   1. X-Forwarded-For. Cello reads the client address from this header and
#      nowhere else, so without it every session and audit entry records a null
#      IP — and the "where was this account signed in from" screen is empty.
#
#   2. The SPA fallback. /oauth/callback-style deep links and the client-side
#      router both need unknown paths served index.html, or a refresh on
#      /admin/users returns 404.

server {
    listen 443 ssl http2;
    server_name accounts.hynt.one;

    ssl_certificate     /etc/letsencrypt/live/accounts.hynt.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.hynt.one/privkey.pem;

    # This host issues the credentials for the whole estate; it should never be
    # framed, and its cookie must never travel over plaintext.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The silent-renewal iframe on each platform loads /oauth/authorize from
    # this host, so framing must be allowed for the sibling origins. SAMEORIGIN
    # above covers the accounts SPA itself; this relaxes it for /oauth only.
    location /oauth/ {
        add_header Content-Security-Policy
            "frame-ancestors 'self' https://terminal.hynt.one https://xterminal.hynt.one https://intelligence.hynt.one" always;
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/hynt-proxy-params.conf;
    }

    location ~ ^/(api|\.well-known)/ {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/hynt-proxy-params.conf;
    }

    # The built SPA.
    root /var/www/accounts.hynt.one;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name accounts.hynt.one;
    return 301 https://$host$request_uri;
}

### market_intel — static frontend + API reverse proxy.
###
### Same-origin by design: the SPA and /api share a hostname, so no CORS in
### production and the dev proxy in vite.config.ts reproduces the same shape.

server {
    server_name intelligence.hynt.one;

    # Adjust or drop once TLS is in front of this.
    # return 301 https://$host$request_uri;

    root /var/www/intelligence;
    index index.html;

    access_log /var/log/nginx/market-intel.access.log;
    error_log  /var/log/nginx/market-intel.error.log;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # =======================================================================
    #  SECURITY RESPONSE HEADERS  (the Observatory fix — mirrors terminal.hynt.one)
    #  `always` = emit even on error responses (301/404/etc.), which the
    #  scanner also inspects.
    # =======================================================================

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # SAMEORIGIN to match frame-ancestors 'self' below. Browsers that understand
    # frame-ancestors ignore this header entirely; it is here for the ones that
    # do not, and DENY would block the renewal iframe in exactly those.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # credentialless (not require-corp): Google Fonts is loaded cross-origin
    # (font-src/style-src below), so require-corp would need CORP headers we
    # don't control on fonts.gstatic.com. credentialless degrades gracefully.
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-XSS-Protection "0" always;

    # script-src pins the one inline <script> in index.html (the pre-paint
    # theme/font applier) by sha256 hash instead of 'unsafe-inline'. If that
    # inline script in frontend/index.html changes, recompute with:
    #   python3 -c "import re,hashlib,base64;h=open('frontend/index.html').read();\
    #     s=re.findall(r'<script>(.*?)</script>',h,re.S)[0];\
    #     print('sha256-'+base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
    set $csp "default-src 'self'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; object-src 'none'";
    # 'self', not 'none': the silent-renewal iframe ends up on THIS origin's
    # /auth/callback, and 'none' refuses framing by every ancestor including the
    # same origin — so the callback never renders and renewal times out. The
    # threat this directive exists for is a *cross-origin* page framing the desk
    # to hijack a click; that stays blocked. Framing by this origin is not a
    # clickjacking vector: an attacker who can serve a page here already has XSS.
    set $csp "${csp}; frame-ancestors 'self'";
    # Silent renewal loads accounts.hynt.one/oauth/authorize?prompt=none in a
    # hidden iframe. Without frame-src the browser falls back to default-src
    # 'self' and blocks it — the console says "Framing 'https://accounts.hynt.one/'
    # violates ... default-src 'self'", renewal never completes, and the user is
    # bounced to a sign-in page every fifteen minutes.
    #
    # BOTH origins are required, and 'self' is the one that is easy to miss.
    # accounts does not render the result: it 302s the iframe back to THIS
    # origin's /auth/callback, which is where relaySilentCallback() posts the
    # code up to the parent. frame-src governs every navigation in the frame,
    # redirects included, so listing only accounts blocks that last hop. The
    # frame then loads nothing, posts nothing, and the parent sits on its 10s
    # timeout — twice, because the boot does config+me — which reads as the app
    # hanging on "starting…" for 20-30s and then showing the sign-in gate.
    set $csp "${csp}; frame-src 'self' https://accounts.hynt.one";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; img-src 'self' data:";
    set $csp "${csp}; font-src 'self' data: https://fonts.gstatic.com";
    set $csp "${csp}; manifest-src 'self'";
    set $csp "${csp}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com";
    set $csp "${csp}; script-src 'self' 'sha256-AXeTAgmx3cNW1kNBe1HfuheorgvIQD0/4vkAOL6B68E='";
    # 'self' covers this app's own /api. accounts.hynt.one is added because the
    # callback page POSTs the authorization code to its /oauth/token endpoint,
    # which is a cross-origin fetch from this origin.
    set $csp "${csp}; connect-src 'self' https://accounts.hynt.one";
    set $csp "${csp}; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: every unknown path is a client route.
    #
    # `expires -1` (not `add_header Cache-Control`) on purpose: nginx does NOT
    # merge add_header lists between server and location blocks — a location
    # with its own add_header silently drops every server-level add_header
    # (HSTS, CSP, X-Frame-Options, ...) for requests it serves. `expires` sets
    # Cache-Control through a different directive, so it doesn't trigger that
    # reset and the security headers above still reach the HTML document that
    # Observatory scans. Same pattern as terminal.hynt.one's location /.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backfills and long screener queries need room; the default 60s would
        # cut off a legitimate response mid-flight.
        proxy_connect_timeout 10s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;

        proxy_buffering off;
    }

    # Health is polled by monitoring; keep it out of the access log.
    location = /api/health/live {
        proxy_pass http://127.0.0.1:8101;
        access_log off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/intelligence.hynt.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/intelligence.hynt.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = intelligence.hynt.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name intelligence.hynt.one;
    return 404; # managed by Certbot


}
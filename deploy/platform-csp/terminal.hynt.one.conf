#        proxy_set_header X-Forwarded-Proto $scheme;
#        proxy_buffering off;
#        proxy_cache off;
#        proxy_read_timeout 3600s;
#        proxy_send_timeout 3600s;
#        client_max_body_size 64k;   # MCP_MAX_BODY_BYTES; tool args are small
#        access_log /var/log/nginx/hyntronix-mcp.log mcp_redacted;
#    }
#
#    location /mcp {
#        proxy_pass http://127.0.0.1:8100;
#        proxy_http_version 1.1;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#        proxy_buffering off;
#        proxy_cache off;
#        proxy_read_timeout 3600s;
#        proxy_send_timeout 3600s;
#        client_max_body_size 64k;
#        access_log /var/log/nginx/hyntronix-mcp.log mcp_redacted;
#    }

    # Long-cache the fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }







    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/terminal.hynt.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/terminal.hynt.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = terminal.hynt.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name terminal.hynt.one;
    listen 80;
    return 404; # managed by Certbot


}
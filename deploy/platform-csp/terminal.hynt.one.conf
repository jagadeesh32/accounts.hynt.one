server {
    server_name terminal.hynt.one;

    root /var/www/terminal;
    index index.html;


    # =======================================================================
    #  COMPRESSION
    #  Shrinks the JS/CSS bundle and every /api JSON payload on the wire. text/html
    #  is always compressed by nginx; the list below covers the rest. gzip_proxied
    #  lets it also compress the proxied /api responses from Uvicorn. (If you serve
    #  users only through Cloudflare, CF already brotli-compresses at the edge — this
    #  still helps direct-origin hits and costs nothing.)
    # =======================================================================
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;


    # =======================================================================
    #  SECURITY RESPONSE HEADERS  (the Observatory fix)
    #  `always` = emit even on error responses (301/404/etc.), which the
    #  scanner also inspects.
    # =======================================================================

    # HSTS — you already pass this. Upgraded to 1yr + preload + includeSubDomains
    # so you can submit to https://hstspreload.org/ for the extra credit.
    # ONLY enable includeSubDomains/preload once EVERY subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Clickjacking — XFO for old browsers, frame-ancestors (in the CSP below)
    # for modern ones. Both say "this page may not be framed by anyone".
    add_header X-Frame-Options "DENY" always;

    # MIME-sniffing — you already pass this.
    add_header X-Content-Type-Options "nosniff" always;

    # Cross-Origin-Resource-Policy — the header Observatory flagged as missing.
    # same-origin = other sites can't hotlink/embed our resources.
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Leak less URL info to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lock down powerful browser features this app never uses.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;


    set $csp "default-src 'self'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; frame-ancestors 'none'";
    # Silent renewal loads accounts.hynt.one/oauth/authorize?prompt=none in a
    # hidden iframe. Without frame-src the browser falls back to default-src
    # 'self' and blocks it — the console says "Framing 'https://accounts.hynt.one/'
    # violates ... default-src 'self'", renewal never completes, and the user is
    # bounced to a sign-in page every fifteen minutes.
    set $csp "${csp}; frame-src https://accounts.hynt.one";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; img-src 'self' data:";
    set $csp "${csp}; font-src 'self' data:";
    set $csp "${csp}; manifest-src 'self'";
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    set $csp "${csp}; script-src 'self' 'sha256-0N+v7OKEurMBscrMy1PC1RqFdNuoiU+Pt2yaDFVsc24=' https://static.cloudflareinsights.com";
    # 'self' covers this app's own /api. accounts.hynt.one is added because the
    # callback page POSTs the authorization code to its /oauth/token endpoint,
    # which is a cross-origin fetch from this origin.
    set $csp "${csp}; connect-src 'self' https://accounts.hynt.one";
    set $csp "${csp}; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    # Cross-Origin-Opener-Policy — isolate our browsing context so no other origin
    # keeps a window.opener handle on us. Safe: the app opens no cross-origin popups
    # (auth is same-origin token-based; external links use rel="noreferrer").
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cross-Origin-Embedder-Policy — "credentialless" (not require-corp) is the
    # low-risk choice: the SPA already loads NOTHING cross-origin (the CSP above
    # pins img/font/script/connect to 'self'), so this can't block a real resource,
    # and credentialless degrades gracefully rather than hard-blocking if one ever
    # appears. Flip to require-corp only if you need crossOriginIsolated features.
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Low-severity hardening (all no-ops for this app, just clear the scanners).
    add_header X-Permitted-Cross-Domain-Policies "none" always;   # no Flash/PDF cross-domain
    add_header X-DNS-Prefetch-Control "off" always;               # no speculative DNS
    add_header X-XSS-Protection "0" always;                       # deprecated filter off; CSP supersedes

    # SPA — fall back to index.html for client-side routes
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the FastAPI backend (Uvicorn on 127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;          # scans take 2–4 min
    }


    # (Reference notes for whoever re-enables this — see the DISABLED note below.)
    # The Model Context Protocol surface external LLM clients (Claude, Cursor,
    # ChatGPT…) read this terminal through. Streamable HTTP: a POST per JSON-RPC
    # call plus a long-lived GET held open as an SSE stream.
    #
    # Without these blocks `/mcp` falls through to `location /` and nginx answers
    # with index.html — the client sees HTML (or a 405) instead of JSON-RPC.
    #
    # THE TWO SETTINGS THAT MATTER, and the symptom when they are missing:
    #   proxy_buffering off  — nginx otherwise holds SSE frames in its buffer and
    #                          releases them in batches, so the client sits waiting
    #                          on a stream the server already sent. Looks like a
    #                          hung tool call, not a proxy setting.
    #   proxy_read_timeout   — the default 60s kills an idle-but-healthy stream
    #                          mid-conversation. An hour matches the session TTL.
    #
    # `= /mcp` (exact) as well as the prefix: the backend mounts both spellings
    # (MOUNT_PATHS in app/mcp_server.py) because clients paste both, and a
    # redirect between them is where some HTTP clients drop the Authorization
    # header. nginx must not rewrite either.
    # ── MCP → Uvicorn — DISABLED 2026-08-31 ────────────────────────────────
    # The MCP surface is off (MCP_ENABLED=0 in backend/.env), so the proxy blocks
    # below are commented out. This 404 stands in their place: without it /mcp
    # falls through to `location /` and nginx answers 200 with the SPA's
    # index.html, which tells an MCP client nothing useful. Delete this block and
    # uncomment the two below (plus MCP_ENABLED=1) to bring the surface back up.
    location ^~ /mcp {
        access_log off;
        return 404;
    }

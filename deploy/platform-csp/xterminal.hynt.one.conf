server {
    server_name xterminal.hynt.one;

    root /var/www/xterminal;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # ── Security response headers ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-XSS-Protection "0" always;

    # The script-src hash covers the pre-paint theme bootstrap inlined in
    # index.html. Recompute it if that inline block ever changes:
    #   openssl dgst -sha256 -binary <(script body) | openssl base64
    set $csp "default-src 'self'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; frame-ancestors 'none'";
    # Silent renewal loads accounts.hynt.one/oauth/authorize?prompt=none in a
    # hidden iframe. Without frame-src the browser falls back to default-src
    # 'self' and blocks it — the console says "Framing 'https://accounts.hynt.one/'
    # violates ... default-src 'self'", renewal never completes, and the user is
    # bounced to a sign-in page every fifteen minutes.
    set $csp "${csp}; frame-src https://accounts.hynt.one";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; img-src 'self' data:";
    set $csp "${csp}; font-src 'self' data:";
    set $csp "${csp}; manifest-src 'self'";
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    set $csp "${csp}; script-src 'self' 'sha256-XZ52PTIkU9YOVSZA8gtGqWU4Z/zkzYNld/cj06tyRBw='";
    # 'self' covers this app's own /api. accounts.hynt.one is added because the
    # callback page POSTs the authorization code to its /oauth/token endpoint,
    # which is a cross-origin fetch from this origin.
    set $csp "${csp}; connect-src 'self' https://accounts.hynt.one";
    set $csp "${csp}; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    # ── SPA ────────────────────────────────────────────────────────────────
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── REST API → Uvicorn ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Tick WebSocket → Uvicorn ───────────────────────────────────────────
    # Long-lived: the tape pushes for the whole session, so no idle timeout.
    location /ws {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xterminal.hynt.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xterminal.hynt.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = xterminal.hynt.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name xterminal.hynt.one;
    return 404; # managed by Certbot


}
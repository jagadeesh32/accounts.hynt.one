# accounts.hynt.one — the identity provider.
#
# Serves the accounts SPA from /var/www/accounts and proxies the auth surface to
# Uvicorn on 127.0.0.1:8103. Mirrors terminal.hynt.one's hardening; the
# differences from that file are called out where they matter.
#
# Install: symlink into sites-enabled, then run certbot for the certificate.

server {
    server_name accounts.hynt.one;

    root /var/www/accounts;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # =======================================================================
    #  SECURITY RESPONSE HEADERS
    #  This host holds the password form and the SSO cookie for the whole
    #  estate, so it is the one that most needs them.
    # =======================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-XSS-Protection "0" always;

    # NOTE — X-Frame-Options is deliberately ABSENT here, unlike every other
    # host in the estate, which sends DENY.
    #
    # Silent renewal loads /oauth/authorize?prompt=none in a hidden iframe on the
    # platform's own page — terminal.hynt.one framing accounts.hynt.one, which is
    # cross-origin. X-Frame-Options cannot express "these other origins may frame
    # me": DENY and SAMEORIGIN both forbid exactly the case renewal depends on,
    # and there is no third value. SAMEORIGIN here was worse than nothing — it
    # read as permissive while forbidding the only framing this host wants.
    #
    # frame-ancestors in the CSP below is the control, and a stricter one: only
    # hynt.one origins may frame this host. Browsers that support it ignore
    # X-Frame-Options entirely, so sending both would only mislead the next
    # person to read this file.

    set $csp "default-src 'self'";
    set $csp "${csp}; base-uri 'self'";
    set $csp "${csp}; object-src 'none'";
    set $csp "${csp}; frame-ancestors 'self' https://*.hynt.one";
    set $csp "${csp}; form-action 'self'";
    set $csp "${csp}; img-src 'self' data:";
    set $csp "${csp}; font-src 'self' data:";
    set $csp "${csp}; manifest-src 'self'";
    set $csp "${csp}; style-src 'self' 'unsafe-inline'";
    set $csp "${csp}; script-src 'self'";
    set $csp "${csp}; connect-src 'self'";
    set $csp "${csp}; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    # SPA — client-side routes (/login, /security, /admin) fall back to index.html
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------------------------------------------------------
    #  The auth surface → Uvicorn
    #  Three separate prefixes rather than one catch-all: /oauth and
    #  /.well-known are the estate's contract and must not be swallowed by the
    #  SPA fallback above if the /api block is ever narrowed.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /oauth/ {
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /.well-known/ {
        # Certbot's ACME challenge lives under /.well-known/acme-challenge and is
        # served from disk; everything else here (jwks.json,
        # openid-configuration) comes from the app. try_files gets the order
        # right without a second, more specific location block.
        try_files $uri @accounts_api;
    }

    location @accounts_api {
        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/accounts.hynt.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/accounts.hynt.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = accounts.hynt.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name accounts.hynt.one;

    listen 80;
    return 404; # managed by Certbot


}
# Shared proxy headers. Install at /etc/nginx/hynt-proxy-params.conf.
#
# X-Forwarded-For is not optional here: it is the only source of the client
# address for session records, the audit trail and the per-IP login throttle.
# Without it the throttle degrades to per-email only, which lets one attacker
# lock a real user out of their own account from anywhere.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_read_timeout 60s;

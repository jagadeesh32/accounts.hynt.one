[project]
name = "hynt-sso"
version = "1.0.0"
description = "Verify accounts.hynt.one access tokens inside a Hynt platform backend."
requires-python = ">=3.11"
dependencies = ["pyjwt[crypto]>=2.9", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hynt_sso"]

[project]
name = "hynt-sso"
version = "1.0.0"
description = "Verify accounts.hynt.one tokens inside a Hynt platform backend."
requires-python = ">=3.10"
dependencies = ["pyjwt[crypto]>=2.9", "httpx>=0.27"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hynt_sso"]

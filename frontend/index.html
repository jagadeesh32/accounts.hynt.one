<!doctype html>
<html lang="en" data-theme="daylight" data-font="system" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#05080f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hynt Accounts</title>

    <!-- No inline scripts and no third-party stylesheet links here,
         deliberately. This host's CSP is `script-src 'self'` and
         `font-src 'self' data:` with no hash allowance and no external origin —
         it holds the password form and the SSO cookie for the estate, so it
         stays that way.

         The saved appearance is therefore applied at the top of main.tsx, from
         the bundle, and the web fonts are self-hosted (styles/fonts.css). The
         attributes above are the default so the first frame is correct for a
         new visitor; a returning one is repainted by the bundle. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- data-cfasync="false" opts this out of Cloudflare Rocket Loader, which
         rewrites type="module" to a bogus MIME type and re-executes the bundle
         itself — unreliably, for ES modules. This is the identity provider's own
         login page: if it does not boot, nothing in the estate can be signed
         into. See the matching plugin in vite.config.ts, which re-adds the
         attribute Vite strips when it rewrites this tag. -->
    <script data-cfasync="false" type="module" src="/src/main.tsx"></script>
  </body>
</html>
